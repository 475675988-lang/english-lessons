        function initPlayer() {
            document.getElementById('sentenceCount').innerText = sentences.length;
            
            // 监听 canplaythrough 事件，表示浏览器认为可以从头到尾流畅播放
            player.addEventListener('canplaythrough', audioReady);
            
            // 如果音频已经就绪（比如浏览器缓存了），直接调用 audioReady
            if (player.readyState >= 4) { // HAVE_ENOUGH_DATA
                audioReady();
            }
        }
        
        function audioReady() {
            // 确保只运行一次
            player.removeEventListener('canplaythrough', audioReady); 
            
            // 隐藏加载提示，显示列表
            loadingMsg.style.display = 'none';
            listContainer.style.display = 'block';
            
            renderList();
        }
        
        // ... (其他函数保持不变) ...

        function renderList() {
            if (sentences.length === 0) {
                listContainer.innerHTML = '<div style="text-align:center; color:red; margin-top:50px;">⚠️ 字幕数据为空，请检查 JSON 数据是否粘贴正确。</div>';
                return;
            }

            sentences.forEach((item, index) => {
                const div = document.createElement('div');
                div.className = 'sentence';
                
                const timeTag = document.createElement('span');
                timeTag.className = 'time-tag';
                timeTag.innerText = formatTime(item.start);
                
                const textSpan = document.createElement('span');
                textSpan.innerText = item.text;

                div.appendChild(timeTag);
                div.appendChild(textSpan);

                div.onclick = () => playSegment(item.start, item.end, div);
                listContainer.appendChild(div);
            });
        }

        function formatTime(seconds) {
            const m = Math.floor(seconds / 60);
            const s = Math.floor(seconds % 60);
            return (m < 10 ? '0' : '') + m + ':' + (s < 10 ? '0' : '') + s;
        }

        function playSegment(start, end, element) {
            document.querySelectorAll('.sentence').forEach(el => el.classList.remove('active'));
            element.classList.add('active');

            if (stopTimer) clearTimeout(stopTimer);
            
            const offset = 0.5; 
            let realStart = start + offset;
            let duration = (end - realStart) * 1000;
            
            if (realStart < 0) realStart = start; 
            if (duration < 0) duration = (end - start) * 1000; 

            player.currentTime = realStart; 
            player.play();

            stopTimer = setTimeout(() => {
                player.pause();
            }, duration + 100); 
        }
    </script>
